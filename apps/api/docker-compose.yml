# Runs the Agora server container + a supercronic scheduler sidecar. Postgres/Auth/Storage are
# hosted on Supabase, so there is no local DB service — the containers just need the env
# (DATABASE_URL etc.) from your .env file.
#   docker compose up --build
# Apply migrations once (one-off, drizzle-kit-free):
#   docker compose run --rm agora npm run db:migrate:run
services:
  agora:
    build: .
    image: agora-server
    env_file: .env
    ports:
      - "${PORT:-4000}:4000"
    init: true
    restart: unless-stopped

  # Scheduler: fires the secret-gated /internal/cron/* endpoints over the internal network on the
  # schedule in ./crontab. Requires CRON_SECRET in .env (without it the endpoints return 503).
  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    image: agora-cron
    env_file: .env # CRON_SECRET
    environment:
      AGORA_URL: http://agora:4000
    depends_on:
      - agora
    init: true
    restart: unless-stopped
