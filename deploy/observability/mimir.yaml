# Grafana Mimir — monolithic, local-filesystem metrics store for the Agora observability profile.
# Alloy scrapes the apps' Prometheus endpoints (:9464) and remote-writes here (mimir:9009/api/v1/push);
# Grafana queries the Prometheus-compatible API at mimir:9009/prometheus. Single-tenant, local disk —
# fine for a single host / demo; point the storage blocks at object storage to scale out.
multitenancy_enabled: false

server:
  http_listen_port: 9009
  log_level: warn

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/storage

# Single-node (monolithic) deploy: one ingester in the ring. Mimir defaults to
# replication_factor 3, whose write quorum (2 live replicas) can never be met by a
# lone ingester — every remote-write 500s with "at least 2 live replicas required,
# could only find 1". RF 1 makes the single ingester authoritative. Scale-out needs RF 3.
ingester:
  ring:
    replication_factor: 1

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/ruler

# Generous single-node limits + a usable OTLP-derived retention window for a demo/single-host deploy.
limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  out_of_order_time_window: 10m
  compactor_blocks_retention_period: 168h
