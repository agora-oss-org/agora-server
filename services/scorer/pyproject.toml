[project]
name = "agora-scorer"
version = "0.0.1"
description = "Agora content scoring/moderation subsystem — dual RoBERTa + Claude Haiku cascade over pgmq (replaces @agora/moderator)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Runtime deps are split by container at build time (see requirements.txt + the two Dockerfiles):
#   model_server: fastapi, uvicorn, transformers, torch (CPU), pydantic
#   worker:       fastapi, uvicorn, httpx, asyncpg, pyjwt, anthropic|httpx, neo4j, pydantic
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "asyncpg>=0.29",
  "pyjwt>=2.8",
  "neo4j>=5.19",
]

[project.optional-dependencies]
model = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4", "mypy>=1.9"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true  # asyncpg/neo4j/transformers/torch ship partial or no stubs

[tool.setuptools.packages.find]
include = ["scorer*", "model_server*", "worker*"]
