# Runs the Agora server container. Postgres/Auth/Storage are hosted on Supabase, so there is no
# local DB service — the container just needs the env (DATABASE_URL etc.) from your .env file.
#   docker compose up --build
# Apply migrations once (one-off, drizzle-kit-free):
#   docker compose run --rm agora npm run db:migrate:run
services:
  agora:
    build: .
    image: agora-server
    env_file: .env
    ports:
      - "${PORT:-4000}:4000"
    init: true
    restart: unless-stopped
