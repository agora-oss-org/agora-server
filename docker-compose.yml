# Runs the Agora API container + a supercronic scheduler sidecar. Postgres/Auth/Storage are
# hosted on Supabase, so there is no local DB service — the containers just need the env
# (DATABASE_URL etc.) from your root .env file.
#   docker compose up --build
# Apply migrations once (one-off, drizzle-kit-free):
#   docker compose run --rm agora node scripts/migrate.mjs
services:
  agora:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: agora-api
    env_file: .env
    ports:
      - "${PORT:-4000}:4000"
    init: true
    restart: unless-stopped

  # OPTIONAL shared rate-limit store. Only needed when running MORE THAN ONE `agora` replica — a single
  # replica limits fine in-process. Gated behind the `scale` profile so the default deploy stays
  # Redis-free:  docker compose --profile scale up
  # Then set REDIS_URL=redis://redis:6379 in .env (least-privilege ACL: see apps/api/README.md). The api
  # fail-opens to in-memory if Redis is unreachable. No persistence — these are throwaway counters.
  redis:
    image: redis:7-alpine
    profiles: ["scale"]
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    init: true
    restart: unless-stopped

  # ── services/scorer ──────────────────────────────────────────────────────────────────────────
  # Python scoring/moderation subsystem — REPLACES @agora/moderator. Async, post-publish: a Postgres
  # trigger (migration 0026) enqueues jobs on Supabase pgmq; the worker scores with two RoBERTa model
  # servers in parallel, cascades borderline toxicity to Claude Haiku, writes removals back through the
  # api, records moderation_analyses (the admin AI-flag queue), and MERGEs a relationship edge into
  # Neo4j. See docs/SCORER.md. FOUNDATION: ML/pgmq/Neo4j/Haiku I/O are stubs in this pass.

  # RoBERTa toxicity classifier (model warm in RAM). Pinned to dedicated cores so it runs truly in
  # parallel with the relationship server. cpuset values are HOST-SPECIFIC — adjust to your core layout.
  scorer-toxicity:
    build:
      context: .
      dockerfile: services/scorer/Dockerfile.model-server
    image: agora-scorer-model
    env_file: .env
    environment:
      SCORER_MODEL: ${SCORER_TOXICITY_MODEL:-s-nlp/roberta_toxicity_classifier}
      SCORER_MODEL_KIND: toxicity
      SCORER_PORT: "8001"
      OMP_NUM_THREADS: "2"
    cpuset: "0,1"
    init: true
    restart: unless-stopped

  # RoBERTa relationship-quality (sentiment) classifier — same image, different model + cores.
  scorer-relationship:
    build:
      context: .
      dockerfile: services/scorer/Dockerfile.model-server
    image: agora-scorer-model
    env_file: .env
    environment:
      SCORER_MODEL: ${SCORER_RELATIONSHIP_MODEL:-cardiffnlp/twitter-roberta-base-sentiment-latest}
      SCORER_MODEL_KIND: relationship
      SCORER_PORT: "8002"
      OMP_NUM_THREADS: "2"
    cpuset: "2,3"
    init: true
    restart: unless-stopped

  # Orchestrator: pgmq consumer + cascade + write-back + Neo4j + the operator-gated admin API. Serves
  # /v1/:projectId/moderation/* on :4001 (the admin upstream). Shares DATABASE_URL + ACCESS_TOKEN_SECRET
  # + MODERATION_SERVICE_SECRET with the api; needs ANTHROPIC_API_KEY (Haiku) + NEO4J_* in .env.
  scorer-worker:
    build:
      context: .
      dockerfile: services/scorer/Dockerfile.worker
    image: agora-scorer-worker
    env_file: .env
    environment:
      API_BASE_URL: http://agora:4000
      SCORER_TOXICITY_URL: http://scorer-toxicity:8001
      SCORER_RELATIONSHIP_URL: http://scorer-relationship:8002
      SCORER_ADMIN_PORT: "4001"
    ports:
      - "${SCORER_ADMIN_PORT:-4001}:4001"
    depends_on:
      - agora
      - scorer-toxicity
      - scorer-relationship
      - neo4j
    init: true
    restart: unless-stopped

  # Neo4j for relationship-edge writes. FOUNDATION ONLY — the graph schema is out of scope.
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-please_change_me}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    init: true
    restart: unless-stopped

  # Admin frontend (Vite SPA on nginx). Serves the static build and reverse-proxies /v7 + /socket.io
  # to the api over the internal network (same origin → no CORS, no build-time API URL).
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    image: agora-admin
    environment:
      API_UPSTREAM: http://agora:4000
      # The scorer-worker serves the same /v1/:projectId/moderation/* surface the admin nginx proxies,
      # so only this upstream value changes (env name kept as MODERATOR_UPSTREAM for the foundation).
      MODERATOR_UPSTREAM: http://scorer-worker:4001
    ports:
      - "${ADMIN_PORT:-8080}:80"
    depends_on:
      - agora
      - scorer-worker
    init: true
    restart: unless-stopped

  # Scheduler: fires the secret-gated /internal/cron/* endpoints over the internal network on the
  # schedule in apps/api/crontab. Requires CRON_SECRET in .env (without it the endpoints return 503).
  cron:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.cron
    image: agora-cron
    env_file: .env # CRON_SECRET
    environment:
      AGORA_URL: http://agora:4000
    depends_on:
      - agora
    init: true
    restart: unless-stopped

volumes:
  neo4j-data:
