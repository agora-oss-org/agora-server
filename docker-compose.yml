# Agora compose. TWO-AXIS profile model — a bare `docker compose up` starts NOTHING.
#
# Axis 1 — DATA PLANE + API (REQUIRED, pick EXACTLY ONE; mutually exclusive):
#   --profile supabase   the API (agora + proxy + cron) against EXTERNAL Supabase Postgres + Storage
#   --profile selfhost   the API PLUS local Postgres (db) + MinIO — fully self-contained, no Supabase
#
# Axis 2 — OPTIONAL ADD-ONS (compose freely on top of a data plane):
#   --profile scorer       content-moderation + social-graph: scorer (×3) + neo4j
#   --profile secure-chat  the blind MLS E2E delivery process + redis
#   --profile scale        redis as the cross-replica rate-limit store (multi-replica API)
#   --profile full         shorthand for ALL optional add-ons (= scorer + secure-chat)
#   --profile demo         the 1:1 SDK compatibility harness (../agora-demo), PULLED + served behind the
#                          Caddy front door at /demo/, auto-wired to the local API. See docs/SELF-HOSTING.md.
#   --profile observability Grafana Alloy collector + LGTM (Tempo/Mimir/Loki/Grafana). Telemetry is OFF
#                          by default; turn the apps' exporters on with OTEL_SDK_DISABLED=false in .env.
#
# Profiles are additive (OR). Common invocations (from the repo root):
#   docker compose --profile supabase up --build                   # just the API, Supabase-backed
#   docker compose --profile selfhost up --build                   # just the API, fully self-contained
#   docker compose --profile full --profile supabase up --build    # everything, Supabase-backed
#   docker compose --profile full --profile selfhost up --build    # everything, self-contained
#   docker compose --profile secure-chat up --build                # split secure-chat box (remote DATABASE_URL)
#   docker compose run --rm agora node scripts/migrate.mjs         # migrations
# The `proxy` service (Caddy) is the single public front door — it terminates TLS, serves the admin SPA,
# AND routes /v7 + /socket.io + secure-chat + /moderator + /media to the backends (ONE hop →
# RATE_LIMIT_TRUSTED_HOPS=1). Plain HTTP / behind an external TLS terminator: set SERVER_NAME=:80.
# See docs/SELF-HOSTING.md and apps/secure-chat/README.md.
services:
  agora:
    profiles: ["supabase", "selfhost"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: agora-api
    env_file: .env
    environment:
      # On the compose network, address Neo4j by service name — `.env`'s NEO4J_URI uses `localhost`
      # for host-side dev, which inside a container is the container itself. The API reads NEO4J_URI
      # for the /social/* surfaces. Override via NEO4J_URI_DOCKER if Neo4j lives elsewhere.
      NEO4J_URI: ${NEO4J_URI_DOCKER:-bolt://neo4j:7687}
      # Content deletion semantics: hard (default — truly DELETE rows AND remove their media objects
      # from storage) | soft (tombstone rows, keep media). See .env.*.example for the full contract.
      CONTENT_DELETE_MODE: ${CONTENT_DELETE_MODE:-hard}
      # OpenTelemetry — OFF by default (bare deploys stay dark, no export warnings). The OTLP endpoints
      # are pre-wired to the `observability` profile's Alloy collector, so turning telemetry on is a
      # single flag: set OTEL_SDK_DISABLED=false in .env and bring up `--profile observability`.
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://alloy:4318/v1/traces}
      OTEL_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:-http://alloy:4318/v1/metrics}
      OTEL_LOGS_ENDPOINT: ${OTEL_LOGS_ENDPOINT:-http://alloy:4318/v1/logs}
    ports:
      - "${PORT:-4000}:4000"
    init: true
    restart: unless-stopped

  # Shared Redis. Two consumers: (1) the OPTIONAL cross-replica rate-limit store (only needed with MORE
  # THAN ONE `agora` replica — a single replica limits fine in-process; the api fail-opens to in-memory),
  # and (2) the secure-chat suspension index (a HARD dependency of @agora/secure-chat — fail-closed). Gated
  # behind the `secure-chat`, `scale`, and `full` profiles (secure-chat's hard dep travels with it, so a
  # plain `--profile supabase`/`--profile selfhost` API deploy stays Redis-free unless you add one):
  #   docker compose --profile supabase --profile scale up   (rate limiting alongside the API)
  #   docker compose --profile secure-chat up                (secure-chat solo — redis + secure-chat only)
  # Then set REDIS_URL=redis://redis:6379 in .env (least-privilege ACL: see apps/api/README.md).
  redis:
    image: redis:7-alpine
    profiles: ["secure-chat", "scale", "full"]
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    # Real readiness probe so dependents waiting on `condition: service_healthy` (secure-chat) don't start
    # before Redis accepts commands — secure-chat hydrates its suspension index against it on boot.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    init: true
    restart: unless-stopped

  # ── self-hosted data plane (no Supabase) ─────────────────────────────────────────────────────────
  # `selfhost` is one of the two mutually-exclusive DATA PLANES (the other is `supabase`). On top of the
  # API (agora + proxy + cron, which ride the data-plane profiles) it adds local replacements for the two
  # Supabase-hosted dependencies so the SAME api image runs fully self-contained: `db` (Postgres) +
  # `minio` (object storage). The `supabase` data plane has no containers — it points DATABASE_URL /
  # STORAGE_PROVIDER at Supabase instead.
  #   docker compose --profile selfhost up                 # the API, fully self-contained
  #   docker compose --profile full --profile selfhost up  # + every optional add-on
  # Then in .env: DATABASE_URL=postgres://postgres:<pw>@db:5432/postgres, STORAGE_PROVIDER=s3, the S3_*
  # block (S3_ENDPOINT=http://minio:9000, S3_PUBLIC_URL=<public-origin>/media, creds = MINIO_ROOT_*),
  # and DEFAULT_AUTH_PROVIDER=native. See docs/SELF-HOSTING.md.

  # Postgres for self-hosting. The supabase/postgres image bundles what the migrations assume —
  # pgvector + PostGIS + pgmq extensions and the authenticated/anon/service_role roles + auth.uid() — so
  # the schema + RLS migrations apply unchanged against it. Apply migrations once after `up`:
  #   docker compose run --rm agora node scripts/migrate.mjs
  db:
    image: supabase/postgres:15.8.1.060
    profiles: ["selfhost"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-please_change_me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # First-boot only: give supabase_auth_admin a password (the image doesn't derive one from
      # POSTGRES_PASSWORD; the bundled GoTrue needs it). Existing volumes: see the file's header.
      - ./deploy/db/init-auth-role.sql:/docker-entrypoint-initdb.d/init-scripts/99-agora-auth-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true
    restart: unless-stopped

  # MinIO — S3-compatible object storage for self-hosting (STORAGE_PROVIDER=s3). The api creates the
  # bucket + public-read policy in-code on first upload (lib/storage/s3.ts), so no `mc` bootstrap sidecar
  # is needed. Public objects are served to browsers through the Caddy front door's /media route (never
  # :9000 directly). Console on :9001. Credentials = MINIO_ROOT_USER/PASSWORD, also the api's S3_* creds.
  minio:
    image: minio/minio:latest
    profiles: ["selfhost"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-please_change_me}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped

  # GoTrue — Supabase Auth, self-hosted (SSO for the selfhost profile). Runs against the local
  # supabase/postgres `db` (which ships the `auth` schema + supabase_auth_admin role; GoTrue applies
  # its own migrations there at boot — Drizzle never touches the auth schema). Reached ONLY through
  # the Caddy front door: publicly at /auth/v1/* (OAuth provider callbacks + email links), and
  # internally on proxy:9998 (the api's server-side supabase-js base URL — no hairpin needed).
  # Keys: run `node apps/api/scripts/gen-gotrue-keys.mjs` and paste the trio into .env.
  # Social login: set the GOTRUE_EXTERNAL_<PROVIDER>_* vars (Apple's SECRET comes from
  # apps/api/scripts/gen-apple-client-secret.mjs and expires ≤180 days).
  gotrue:
    image: supabase/auth:v2.170.0
    profiles: ["selfhost"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      # The supabase/postgres image provisions supabase_auth_admin with POSTGRES_PASSWORD.
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-please_change_me}@db:5432/postgres
      # Public base of THIS GoTrue as browsers/providers see it — your origin + /auth/v1.
      API_EXTERNAL_URL: ${GOTRUE_EXTERNAL_URL:-http://localhost/auth/v1}
      # Where email links / OAuth flows land by default: your front-end origin.
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost}
      # Comma-separated extra redirect origins/globs the OAuth + email flows may target.
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?generate with apps/api/scripts/gen-gotrue-keys.mjs}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      # Email: real deployments set the SMTP block; AUTOCONFIRM=true is the no-SMTP dev switch
      # (sign-ups confirm instantly; password-reset-by-email is unavailable).
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-false}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME:-Agora}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      # Social providers — all off until configured. REDIRECT_URI is always <origin>/auth/v1/callback.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_URL:-http://localhost/auth/v1}/callback
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GOTRUE_EXTERNAL_GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GOTRUE_EXTERNAL_GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GOTRUE_EXTERNAL_GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${GOTRUE_EXTERNAL_URL:-http://localhost/auth/v1}/callback
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${GOTRUE_EXTERNAL_APPLE_ENABLED:-false}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${GOTRUE_EXTERNAL_APPLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${GOTRUE_EXTERNAL_APPLE_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_URL:-http://localhost/auth/v1}/callback
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    init: true
    restart: unless-stopped

  # ── @agora/secure-chat ─────────────────────────────────────────────────────────────────────────
  # The blind MLS (E2E) Delivery Service — an INDEPENDENT process split from the api (load-balancing /
  # solo deploys). Shares the same Postgres (DATABASE_URL) + Redis as the api. Serves
  # /v7/:projectId/secure-chat/* (REST) + the /secure realtime on engine.io path /secure-socket/ (the
  # Caddy front door routes both here). Redis is a HARD dependency (the fail-closed suspension index): set
  # REDIS_URL=redis://redis:6379 in .env. In the `secure-chat` profile it starts the secure-chat PROCESS +
  # redis with NO API stack — a standalone/split box that points DATABASE_URL at a REMOTE Postgres
  # (Supabase or the API box). It does NOT bundle a database; the target DB must already be migrated.
  #   docker compose --profile secure-chat up                  # split box → remote DATABASE_URL, no API
  # Alongside the API it travels in `full`, so `--profile full --profile <supabase|selfhost>` brings it up
  # behind the Caddy front door automatically (no separate flag needed).
  secure-chat:
    build:
      context: .
      dockerfile: apps/secure-chat/Dockerfile
    image: agora-secure-chat
    profiles: ["secure-chat", "full"]
    env_file: .env
    environment:
      # Distinct service.name so secure-chat is its own service in Grafana — the shared @agora/core YAML
      # defaults to agora-api, and env_file would inject the API's SERVICE_NAME here. This override wins
      # (instrument.ts has the same fallback for non-compose runs).
      SERVICE_NAME: ${SECURE_CHAT_SERVICE_NAME:-agora-secure-chat}
      # OpenTelemetry — same off-by-default + Alloy-pre-wired model as the api (see the agora service).
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://alloy:4318/v1/traces}
      OTEL_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:-http://alloy:4318/v1/metrics}
      OTEL_LOGS_ENDPOINT: ${OTEL_LOGS_ENDPOINT:-http://alloy:4318/v1/logs}
    ports:
      - "${SECURE_CHAT_PORT:-4002}:4002"
    depends_on:
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  # ── services/scorer (the `scorer` profile) ───────────────────────────────────────────────────
  # Python content-moderation + social-graph subsystem. Async, post-publish: Postgres triggers enqueue
  # jobs on pgmq; the worker (1) scores content with two RoBERTa classifiers + Claude Haiku escalation
  # and writes removals back through the API, and (2) projects INTERACTED/FOLLOWS/CONNECTED/FRICTION
  # social-graph edges into Neo4j. See docs/SCORER.md + docs/SOCIAL-GRAPH.md.

  # RoBERTa toxicity classifier (model warm in RAM). Pinned to a single dedicated core to avoid
  # contention with the relationship server. cpuset values are HOST-SPECIFIC — adjust to your core layout.
  # See docs/SCORER-REQUIREMENTS.md for deployment-specific configs.
  scorer-toxicity:
    profiles: ["scorer", "full"]
    build:
      context: .
      dockerfile: services/scorer/Dockerfile.model-server
    image: agora-scorer-model
    env_file: .env
    environment:
      SCORER_MODEL: ${SCORER_TOXICITY_MODEL:-s-nlp/roberta_toxicity_classifier}
      SCORER_MODEL_KIND: toxicity
      SCORER_PORT: "8001"
      OMP_NUM_THREADS: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # OpenTelemetry (Python SDK) — off by default. Traces push OTLP to the observability Alloy
      # collector; metrics are exposed on :9464 for Alloy to SCRAPE (see config.alloy's scorer scrape
      # job), never pushed — Alloy's OTLP receiver intentionally drops metrics to avoid double-counting.
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_SERVICE_NAME: agora-scorer-toxicity
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
    cpuset: "0"
    mem_limit: "1.5g"
    init: true
    restart: unless-stopped
    # Persist the HF model download (HF_HOME, set in the image) so a container recreate doesn't
    # re-download. Shared with scorer-relationship — HF caches per model repo, so no collision.
    volumes:
      - scorer-hf-cache:/home/scorer/.cache/huggingface

  # RoBERTa relationship-quality (sentiment) classifier — same image, different model + core.
  scorer-relationship:
    profiles: ["scorer", "full"]
    build:
      context: .
      dockerfile: services/scorer/Dockerfile.model-server
    image: agora-scorer-model
    env_file: .env
    environment:
      SCORER_MODEL: ${SCORER_RELATIONSHIP_MODEL:-cardiffnlp/twitter-roberta-base-sentiment-latest}
      SCORER_MODEL_KIND: relationship
      SCORER_PORT: "8002"
      OMP_NUM_THREADS: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # OpenTelemetry (Python SDK) — off by default. Traces push OTLP, metrics are scraped on :9464 —
      # see the toxicity service's comment above.
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_SERVICE_NAME: agora-scorer-relationship
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
    cpuset: "1"
    mem_limit: "1.5g"
    init: true
    restart: unless-stopped
    volumes:
      - scorer-hf-cache:/home/scorer/.cache/huggingface

  # Orchestrator: pgmq consumer + cascade + write-back + Neo4j + the operator-gated admin API. Serves
  # /v1/:projectId/moderation/* on :4001 (the admin upstream). Shares DATABASE_URL + ACCESS_TOKEN_SECRET
  # + MODERATION_SERVICE_SECRET with the api; needs ANTHROPIC_API_KEY (Haiku) + NEO4J_* in .env.
  scorer-worker:
    profiles: ["scorer", "full"]
    build:
      context: .
      dockerfile: services/scorer/Dockerfile.worker
    image: agora-scorer-worker
    env_file: .env
    environment:
      API_BASE_URL: http://agora:4000
      SCORER_TOXICITY_URL: http://scorer-toxicity:8001
      SCORER_RELATIONSHIP_URL: http://scorer-relationship:8002
      SCORER_ADMIN_PORT: "4001"
      # Address Neo4j by service name on the compose network — `.env`'s NEO4J_URI uses `localhost`
      # for host-side dev (which resolves to this container inside Docker). Override via
      # NEO4J_URI_DOCKER if Neo4j lives elsewhere.
      NEO4J_URI: ${NEO4J_URI_DOCKER:-bolt://neo4j:7687}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # OpenTelemetry (Python SDK) — off by default. Traces push OTLP, metrics are scraped on :9464 —
      # see the toxicity service's comment above.
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_SERVICE_NAME: agora-scorer-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
    ports:
      - "${SCORER_ADMIN_PORT:-4001}:4001"
    mem_limit: "512m"
    depends_on:
      agora:
        condition: service_started
      scorer-toxicity:
        condition: service_started
      scorer-relationship:
        condition: service_started
      neo4j:
        condition: service_healthy   # wait until Neo4j accepts Bolt, not just container start
    init: true
    restart: unless-stopped

  # Neo4j / DozerDB — social-graph database. The scorer writes INTERACTED/FOLLOWS/CONNECTED/FRICTION
  # edges; the API reads them for GET /social/weather and GET /social/neighborhood. Rides the `scorer`
  # profile (scorer-worker hard-depends on it); without it the API's /social/* reads return 503.
  neo4j:
    profiles: ["scorer", "full"]
    image: graphstack/dozerdb:5.26.3.0
    # No env_file here — Neo4j maps every NEO4J_* var to a config key, so passing NEO4J_URI
    # (which the API/scorer use to connect) would crash it with "Unrecognized setting: URI".
    # NEO4J_AUTH is the one shared var: same "user/password" format on both sides.
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/please_change_me}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:-yes}
      # Tie the server's default database to NEO4J_DATABASE so the named DB always restarts online
      # (DozerDB doesn't yet auto-start non-default DBs). Overridable via NEO4J_initial_dbms_default__database.
      NEO4J_initial_dbms_default__database: ${NEO4J_initial_dbms_default__database:-${NEO4J_DATABASE:-neo4j}}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: ${NEO4J_apoc_export_file_enabled:-true}
      NEO4J_apoc_import_file_enabled: ${NEO4J_apoc_import_file_enabled:-true}
      NEO4J_dbms_security_procedures_unrestricted: ${NEO4J_dbms_security_procedures_unrestricted:-gds.*,apoc.*}
      NEO4J_dbms_security_procedures_allowlist: ${NEO4J_dbms_security_procedures_allowlist:-gds.*,apoc.*}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_server_memory_heap_initial__size:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_server_memory_heap_max__size:-1024m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_server_memory_pagecache_size:-256m}
      # TLS: configure via NEO4J_dbms_ssl_policy_bolt_* when TLS is needed (production).
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - ./neo4j/plugins:/plugins    # OpenGDS jar (open-gds-2.12.0.jar) — loaded at startup
      # Mount SSL certs here when NEO4J_dbms_ssl_policy_bolt_enabled=true (production).
      # - ./deploy/neo4j/ssl:/ssl:ro
    # Readiness probe: actually run a Bolt query (not just a port check) so dependents that wait on
    # `condition: service_healthy` don't connect before the DB is up. Creds are parsed from NEO4J_AUTH
    # ("user/password") via shell expansion — $$ escapes compose's own interpolation.
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s   # plugins (APOC + OpenGDS) extend cold-start; don't fail the container early
    init: true
    restart: unless-stopped

  # Single public front door (Caddy) — TLS termination + the admin SPA static build + ALL service
  # routing, replacing the old admin nginx. Terminates HTTPS with AUTOMATIC Let's Encrypt certs
  # (auto-renewed; internal CA for localhost), adds HSTS + security headers + a request-body cap + an
  # authoritative X-Forwarded-For, serves the SPA from the baked-in build, and reverse-proxies
  # /v7 + /socket.io → agora, /v7/:projectId/secure-chat/* + /secure-socket/ → secure-chat,
  # /moderator → scorer-worker, /media → minio (routing lives in deploy/proxy/agora-routes.caddy).
  # It IS the API's front door (serves the SPA + routes everything), so it rides the data-plane profiles
  # (`supabase`/`selfhost`) — up whenever the API is. There is ONE proxy hop now, so set
  # RATE_LIMIT_TRUSTED_HOPS=1 in .env. For a real domain set SERVER_NAME (DNS → this host so ACME can
  # validate on :80) and firewall the now-internal 4000/4001 host ports. Plain HTTP / behind an external
  # TLS terminator: set SERVER_NAME=:80 (Caddy serves HTTP, skips ACME).
  proxy:
    profiles: ["supabase", "selfhost"]
    build:
      context: .
      dockerfile: deploy/proxy/Dockerfile
    image: agora-proxy
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-25MB}
      # ACME expiry-notice email — only consumed if you uncomment `email {$ACME_EMAIL}` in the auto-TLS
      # Caddyfile's global block. Left empty by default (an empty `email` arg would make Caddy error,
      # which is why the Caddyfile line stays commented until you opt in). Unused by the onion variant.
      ACME_EMAIL: ${ACME_EMAIL:-}
      # ACME CA endpoint. Defaults to Let's Encrypt STAGING (untrusted certs, but no prod rate-limit risk
      # while validating DNS/firewall). Set ACME_CA to the prod directory for real, browser-trusted certs:
      #   ACME_CA=https://acme-v02.api.letsencrypt.org/directory   (see deploy/proxy/README.md)
      ACME_CA: ${ACME_CA:-https://acme-staging-v02.api.letsencrypt.org/directory}
      # Per-service upstreams (same env names the old admin nginx used). Caddy resolves these LAZILY
      # (per-request DNS), so a service that isn't deployed (secure-chat without `--profile secure`,
      # minio without `--profile selfhost`) simply 502s on its routes instead of crashing the proxy.
      API_UPSTREAM: http://agora:4000
      MODERATOR_UPSTREAM: http://scorer-worker:4001
      SECURE_CHAT_UPSTREAM: http://secure-chat:4002
      MINIO_UPSTREAM: http://minio:9000
      # Demo SPA upstream (the `demo` profile). Lazily resolved like the others — 502s /demo/* until up.
      DEMO_UPSTREAM: http://demo:80
      # Grafana upstream (the `observability` profile). Front door serves it at /grafana/ (502s until up).
      GRAFANA_UPSTREAM: http://grafana:3000
      # GoTrue upstream (selfhost SSO). Lazily resolved — /auth/v1/* 502s until the profile is up.
      GOTRUE_UPSTREAM: http://gotrue:9999
      S3_BUCKET: ${S3_BUCKET:-agora}
      # Origin of your PUBLIC consumer app (the community front end users actually visit). The admin
      # SPA reads it at RUNTIME from /config.js (written by the proxy entrypoint at start) to build the
      # "Open in app" deep links on reports / AI flags / steward cases. Unset → those links fall back to
      # the local demo dev server (http://localhost:5174/), which is wrong on any real deployment.
      AGORA_PUBLIC_APP_URL: ${AGORA_PUBLIC_APP_URL:-}
      # The remaining admin settings, same runtime seam (all optional — unset keeps the image's
      # build-time default). Lets ONE published image serve a different project / API origin / feature
      # set with no rebuild.
      AGORA_ADMIN_API_BASE_URL: ${AGORA_ADMIN_API_BASE_URL:-}
      AGORA_ADMIN_MODERATOR_BASE_URL: ${AGORA_ADMIN_MODERATOR_BASE_URL:-}
      AGORA_ADMIN_PROJECT_ID: ${AGORA_ADMIN_PROJECT_ID:-}
      AGORA_ADMIN_SOCIAL_GRAPH_ENABLED: ${AGORA_ADMIN_SOCIAL_GRAPH_ENABLED:-}
      # UI guard only, NOT a security boundary — the server enforces via OPERATOR_RO_EMAILS.
      AGORA_ADMIN_SETTINGS_READ_ONLY: ${AGORA_ADMIN_SETTINGS_READ_ONLY:-}
      # ⚠️ PUBLIC: served to every visitor in /config.js. Point at the shared demo login only.
      # Optional Umami analytics for the admin app — BOTH required or tracking stays off. Browser-side
      # only: the admin posts events straight to your Umami instance; the API has no analytics code.
      AGORA_ADMIN_UMAMI_URL: ${AGORA_ADMIN_UMAMI_URL:-}
      AGORA_ADMIN_UMAMI_ID: ${AGORA_ADMIN_UMAMI_ID:-}
      AGORA_ADMIN_DEMO_EMAIL: ${AGORA_ADMIN_DEMO_EMAIL:-}
      AGORA_ADMIN_DEMO_PASSWORD: ${AGORA_ADMIN_DEMO_PASSWORD:-}
    volumes:
      # The default Caddyfile + routing snippet are BAKED into the agora-proxy image; these two mounts
      # just overlay the repo copies so you can HOT-EDIT routing/headers in dev without a rebuild (the
      # mount wins over the baked file). For a `.onion` / static cert, set
      # CADDYFILE=./deploy/proxy/Caddyfile.onion (ACME can't issue for .onion — that variant serves a
      # cert you drop in the certs dir below). Production (docker-compose.prod.yml) drops these mounts.
      - ${CADDYFILE:-./deploy/proxy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./deploy/proxy/agora-routes.caddy:/etc/caddy/agora-routes.caddy:ro
      # Operator-supplied TLS certs for the onion/static-cert variant, mounted read-only at /certs
      # (site.pem + site.key). Harmless empty mount for the default auto-ACME file, which never reads it.
      - ${CADDY_CERTS_DIR:-./deploy/proxy/certs}:/certs:ro
      - caddy-data:/data # persists issued certs + ACME account — survives restarts (avoids LE rate limits)
      - caddy-config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    # Upstreams are in the same `full` profile; required:false keeps the project valid when an upstream's
    # own profile (secure / selfhost) isn't requested. Caddy resolves upstreams lazily, so it just 502s
    # the affected routes until they're up.
    depends_on:
      agora:
        condition: service_started
        required: false
      scorer-worker:
        condition: service_started
        required: false
    init: true
    restart: unless-stopped

  # Scheduler: fires the secret-gated /internal/cron/* endpoints over the internal network on the
  # schedule in apps/api/crontab. Requires CRON_SECRET in .env (without it the endpoints return 503).
  cron:
    profiles: ["supabase", "selfhost"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.cron
    image: agora-cron
    env_file: .env # CRON_SECRET
    environment:
      AGORA_URL: http://agora:4000
      # IUC restore-blob TTL sweep targets the secure-chat process (up under --profile full or
      # --profile secure-chat). When it's absent that one cron line is a harmless no-op; lazy-expiry
      # still hides expired blobs on read.
      SECURE_CHAT_URL: ${SECURE_CHAT_URL:-http://secure-chat:4002}
    depends_on:
      - agora
    init: true
    restart: unless-stopped

  # ── agora-demo (the `demo` profile) ──────────────────────────────────────────────────────────────
  # The 1:1 SDK compatibility harness (../agora-demo, its OWN repo) — an OPTIONAL add-on so a self-host
  # evaluator can SEE the forked Replyke SDK exercising THEIR local API in one command. It is a PULLED,
  # PRE-BUILT image (never built from source here — the demo is arms-length on purpose), served behind
  # the SAME Caddy front door at /demo/ so it is same-origin with the API at /v7 (no CORS; cookies +
  # chat sockets just work). The published nginx image bakes its URLs at build time, so it is made
  # retargetable at container start: an entrypoint writes /config.js from AGORA_DEMO_* and the bundle
  # reads window.__AGORA__ first (falling back to its baked default). The bundle is built with Vite
  # base=/demo/, which the Caddy handle_path strips.
  #   docker compose --profile selfhost --profile demo up      # API + demo at http://localhost/demo/
  # Seed the demo login first (genesis/migrations must already be applied — see docs/SELF-HOSTING.md).
  # The demo's login prefill is ALSO runtime-retargeted (AGORA_DEMO_EMAIL/AGORA_DEMO_PASSWORD below,
  # same window.__AGORA__ mechanism as the API URL) — defaulted here to match the credential
  # 00-seed-auth-admin.mjs itself defaults to, so seeding with no ADMIN_EMAIL/PASSWORD override lines up:
  #   docker compose run --rm agora node scripts/seeds/00-seed-auth-admin.mjs   # prompts, Enter = default
  #   docker compose run --rm -e ADMIN_EMAIL=... -e ADMIN_PASSWORD=... agora node scripts/seeds/00-seed-auth-admin.mjs
  # If you override AGORA_DEMO_EMAIL/PASSWORD in .env, seed that same address instead.
  # Pin a version instead of latest via AGORA_DEMO_IMAGE in .env.
  demo:
    profiles: ["demo"]
    image: ${AGORA_DEMO_IMAGE:-docker.io/agoraserver/agora-demo:latest}
    environment:
      # What the BROWSER uses to reach the API. Same-origin through Caddy → /v7. Override for a real
      # domain (e.g. https://example.com/v7). Must be ABSOLUTE — the SDK derives the socket.io origin
      # via new URL(baseUrl), so a relative path would throw.
      AGORA_DEMO_API_BASE_URL: ${AGORA_DEMO_API_BASE_URL:-http://localhost/v7}
      AGORA_DEMO_EMAIL: ${AGORA_DEMO_EMAIL:-agora-admin@agora-oss.org}
      AGORA_DEMO_PASSWORD: ${AGORA_DEMO_PASSWORD:-DemoPass123!}
      # Optional operator link back to the admin SPA (empty hides the button); secure-chat SDK trace
      # toggle; Umami analytics (both empty = no-op). The published image's nginx entrypoint reads all
      # of these into /config.js at start — this is the full AGORA_DEMO_* runtime set (no env_file here
      # on purpose: the arms-length demo image must never see DATABASE_URL / the token secrets).
      AGORA_DEMO_ADMIN_URL: ${AGORA_DEMO_ADMIN_URL:-http://localhost}
      AGORA_DEMO_SECURE_CHAT_DEBUG: ${AGORA_DEMO_SECURE_CHAT_DEBUG:-false}
      AGORA_DEMO_UMAMI_URL: ${AGORA_DEMO_UMAMI_URL:-}
      AGORA_DEMO_UMAMI_ID: ${AGORA_DEMO_UMAMI_ID:-}
    # No host port: the demo is reached through the Caddy front door at /demo/, never directly. Caddy
    # resolves the upstream lazily, so it just 502s /demo/* until this service is up.
    init: true
    restart: unless-stopped

  # ── Observability stack (the `observability` profile) ────────────────────────────────────────────
  # Grafana Alloy collector + the LGTM backends (Tempo · Mimir · Loki · Grafana). An OPTIONAL add-on
  # that rides on top of any data plane — a bare `up` starts none of it. The apps' OTLP endpoints are
  # already pointed at `alloy` (see each service's environment block), so the only thing to flip is
  # OTEL_SDK_DISABLED=false in .env. Configs live in deploy/observability/. Grafana on :3000 (anonymous
  # admin, local-only convenience). See docs/TELEMETRY.md.
  #   docker compose --profile selfhost --profile observability up   # data plane + the full stack
  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.5.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./deploy/observability/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "${ALLOY_PORT:-12345}:12345"   # Alloy UI (optional, localhost)
    depends_on:
      - tempo
      - mimir
      - loki
    init: true
    restart: unless-stopped

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    init: true
    restart: unless-stopped

  mimir:
    profiles: ["observability"]
    image: grafana/mimir:2.14.2
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    volumes:
      - ./deploy/observability/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    init: true
    restart: unless-stopped

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./deploy/observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    init: true
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    environment:
      # Local-convenience auth: anonymous admin, no login form. Lock this down for any shared deploy.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      # Served behind the Caddy front door at /grafana/ (as well as the direct :3000 below). serve-from-
      # sub-path needs the matching root_url so Grafana's asset + redirect URLs carry the prefix.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro   # auto-loaded dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - tempo
      - mimir
      - loki
    init: true
    restart: unless-stopped

volumes:
  neo4j-data:
  caddy-data:
  caddy-config:
  scorer-hf-cache: # HF model downloads for the two scorer model servers (persist across recreate)
  db-data:         # self-hosted Postgres data (selfhost profile)
  minio-data:      # self-hosted object storage (selfhost profile)
  alloy-data:      # Alloy WAL/positions (observability profile)
  tempo-data:      # Tempo trace blocks (observability profile)
  mimir-data:      # Mimir metric blocks (observability profile)
  loki-data:       # Loki log chunks (observability profile)
  grafana-data:    # Grafana state — dashboards, prefs (observability profile)
