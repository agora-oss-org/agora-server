# Runs the Agora API container + a supercronic scheduler sidecar. By DEFAULT, Postgres + Storage are
# hosted on Supabase — the containers just need the env (DATABASE_URL etc.) from your root .env file:
#   docker compose up --build
# For a FULLY self-contained stack (no Supabase), the `selfhost` profile adds local Postgres (`db`) +
# object storage (`minio`); point DATABASE_URL/STORAGE_PROVIDER at them. See docs/SELF-HOSTING.md:
#   docker compose --profile selfhost up --build
# Apply migrations once (one-off, drizzle-kit-free):
#   docker compose run --rm agora node scripts/migrate.mjs
services:
  agora:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: agora-api
    env_file: .env
    ports:
      - "${PORT:-4000}:4000"
    init: true
    restart: unless-stopped

  # Shared Redis. Two consumers: (1) the OPTIONAL cross-replica rate-limit store (only needed with MORE
  # THAN ONE `agora` replica — a single replica limits fine in-process; the api fail-opens to in-memory),
  # and (2) the secure-chat suspension index (a HARD dependency of @agora/secure-chat — fail-closed). Gated
  # behind BOTH the `scale` and `secure` profiles so the default api-only deploy stays Redis-free:
  #   docker compose --profile scale up      (rate limiting)
  #   docker compose --profile secure up     (secure-chat — brings up redis + secure-chat)
  # Then set REDIS_URL=redis://redis:6379 in .env (least-privilege ACL: see apps/api/README.md).
  redis:
    image: redis:7-alpine
    profiles: ["scale", "secure"]
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    # Real readiness probe so dependents waiting on `condition: service_healthy` (secure-chat) don't start
    # before Redis accepts commands — secure-chat hydrates its suspension index against it on boot.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    init: true
    restart: unless-stopped

  # ── self-hosted backends (no Supabase) ───────────────────────────────────────────────────────────
  # The `selfhost` profile brings up local replacements for the two Supabase-hosted dependencies so the
  # SAME api image runs fully self-contained: `db` (Postgres) + `minio` (object storage). Opt-in; the
  # default deploy still points DATABASE_URL/STORAGE_PROVIDER at Supabase and never starts these.
  #   docker compose --profile selfhost up
  # Then in .env: DATABASE_URL=postgres://postgres:<pw>@db:5432/postgres, STORAGE_PROVIDER=s3, the S3_*
  # block (S3_ENDPOINT=http://minio:9000, S3_PUBLIC_URL=<public-origin>/media, creds = MINIO_ROOT_*),
  # and DEFAULT_AUTH_PROVIDER=native. See docs/SELF-HOSTING.md.

  # Postgres for self-hosting. The supabase/postgres image bundles what the migrations assume —
  # pgvector + PostGIS + pgmq extensions and the authenticated/anon/service_role roles + auth.uid() — so
  # the schema + RLS migrations apply unchanged against it. Apply migrations once after `up`:
  #   docker compose run --rm agora node scripts/migrate.mjs
  db:
    image: supabase/postgres:15.8.1.060
    profiles: ["selfhost"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-please_change_me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true
    restart: unless-stopped

  # MinIO — S3-compatible object storage for self-hosting (STORAGE_PROVIDER=s3). The api creates the
  # bucket + public-read policy in-code on first upload (lib/storage/s3.ts), so no `mc` bootstrap sidecar
  # is needed. Public objects are served to browsers through the admin nginx /media route (never :9000
  # directly). Console on :9001. Credentials = MINIO_ROOT_USER/PASSWORD, also used as the api's S3_* creds.
  minio:
    image: minio/minio:latest
    profiles: ["selfhost"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-please_change_me}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped

  # ── @agora/secure-chat ─────────────────────────────────────────────────────────────────────────
  # The blind MLS (E2E) Delivery Service — an INDEPENDENT process split from the api (load-balancing /
  # solo deploys). Shares the same Postgres (DATABASE_URL) + Redis as the api. Serves
  # /v7/:projectId/secure-chat/* (REST) + the /secure realtime on engine.io path /secure-socket/ (the
  # admin nginx routes both here). Redis is a HARD dependency (the fail-closed suspension index): set
  # REDIS_URL=redis://redis:6379 in .env. Gated behind the `secure` profile (also brings up redis):
  #   docker compose --profile secure up
  secure-chat:
    build:
      context: .
      dockerfile: apps/secure-chat/Dockerfile
    image: agora-secure-chat
    profiles: ["secure"]
    env_file: .env
    ports:
      - "${SECURE_CHAT_PORT:-4002}:4002"
    depends_on:
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  # ── services/scorer ──────────────────────────────────────────────────────────────────────────
  # Python content-moderation + social-graph subsystem. Async, post-publish: Postgres triggers enqueue
  # jobs on pgmq; the worker (1) scores content with two RoBERTa classifiers + Claude Haiku escalation
  # and writes removals back through the API, and (2) projects INTERACTED/FOLLOWS/CONNECTED/FRICTION
  # social-graph edges into Neo4j. See docs/SCORER.md + docs/SOCIAL-GRAPH.md.

  # RoBERTa toxicity classifier (model warm in RAM). Pinned to a single dedicated core to avoid
  # contention with the relationship server. cpuset values are HOST-SPECIFIC — adjust to your core layout.
  # See docs/SCORER-REQUIREMENTS.md for deployment-specific configs.
  scorer-toxicity:
    build:
      context: .
      dockerfile: services/scorer/Dockerfile.model-server
    image: agora-scorer-model
    env_file: .env
    environment:
      SCORER_MODEL: ${SCORER_TOXICITY_MODEL:-s-nlp/roberta_toxicity_classifier}
      SCORER_MODEL_KIND: toxicity
      SCORER_PORT: "8001"
      OMP_NUM_THREADS: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    cpuset: "0"
    mem_limit: "1.5g"
    init: true
    restart: unless-stopped
    # Persist the HF model download (HF_HOME, set in the image) so a container recreate doesn't
    # re-download. Shared with scorer-relationship — HF caches per model repo, so no collision.
    volumes:
      - scorer-hf-cache:/home/scorer/.cache/huggingface

  # RoBERTa relationship-quality (sentiment) classifier — same image, different model + core.
  scorer-relationship:
    build:
      context: .
      dockerfile: services/scorer/Dockerfile.model-server
    image: agora-scorer-model
    env_file: .env
    environment:
      SCORER_MODEL: ${SCORER_RELATIONSHIP_MODEL:-cardiffnlp/twitter-roberta-base-sentiment-latest}
      SCORER_MODEL_KIND: relationship
      SCORER_PORT: "8002"
      OMP_NUM_THREADS: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    cpuset: "1"
    mem_limit: "1.5g"
    init: true
    restart: unless-stopped
    volumes:
      - scorer-hf-cache:/home/scorer/.cache/huggingface

  # Orchestrator: pgmq consumer + cascade + write-back + Neo4j + the operator-gated admin API. Serves
  # /v1/:projectId/moderation/* on :4001 (the admin upstream). Shares DATABASE_URL + ACCESS_TOKEN_SECRET
  # + MODERATION_SERVICE_SECRET with the api; needs ANTHROPIC_API_KEY (Haiku) + NEO4J_* in .env.
  scorer-worker:
    build:
      context: .
      dockerfile: services/scorer/Dockerfile.worker
    image: agora-scorer-worker
    env_file: .env
    environment:
      API_BASE_URL: http://agora:4000
      SCORER_TOXICITY_URL: http://scorer-toxicity:8001
      SCORER_RELATIONSHIP_URL: http://scorer-relationship:8002
      SCORER_ADMIN_PORT: "4001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${SCORER_ADMIN_PORT:-4001}:4001"
    mem_limit: "512m"
    depends_on:
      agora:
        condition: service_started
      scorer-toxicity:
        condition: service_started
      scorer-relationship:
        condition: service_started
      neo4j:
        condition: service_healthy   # wait until Neo4j accepts Bolt, not just container start
    init: true
    restart: unless-stopped

  # Neo4j / DozerDB — social-graph database. The scorer writes INTERACTED/FOLLOWS/CONNECTED/FRICTION
  # edges; the API reads them for GET /social/weather and GET /social/neighborhood.
  neo4j:
    image: graphstack/dozerdb:5.26.3.0
    # No env_file here — Neo4j maps every NEO4J_* var to a config key, so passing NEO4J_URI
    # (which the API/scorer use to connect) would crash it with "Unrecognized setting: URI".
    # NEO4J_AUTH is the one shared var: same "user/password" format on both sides.
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/please_change_me}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:-yes}
      NEO4J_initial_dbms_default__database: ${NEO4J_initial_dbms_default__database:-neo4j}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: ${NEO4J_apoc_export_file_enabled:-true}
      NEO4J_apoc_import_file_enabled: ${NEO4J_apoc_import_file_enabled:-true}
      NEO4J_dbms_security_procedures_unrestricted: ${NEO4J_dbms_security_procedures_unrestricted:-gds.*,apoc.*}
      NEO4J_dbms_security_procedures_allowlist: ${NEO4J_dbms_security_procedures_allowlist:-gds.*,apoc.*}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_server_memory_heap_initial__size:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_server_memory_heap_max__size:-1024m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_server_memory_pagecache_size:-256m}
      # TLS: configure via NEO4J_dbms_ssl_policy_bolt_* when TLS is needed (production).
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - ./neo4j/plugins:/plugins    # OpenGDS jar (open-gds-2.12.0.jar) — loaded at startup
      # Mount SSL certs here when NEO4J_dbms_ssl_policy_bolt_enabled=true (production).
      # - ./deploy/neo4j/ssl:/ssl:ro
    # Readiness probe: actually run a Bolt query (not just a port check) so dependents that wait on
    # `condition: service_healthy` don't connect before the DB is up. Creds are parsed from NEO4J_AUTH
    # ("user/password") via shell expansion — $$ escapes compose's own interpolation.
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s   # plugins (APOC + OpenGDS) extend cold-start; don't fail the container early
    init: true
    restart: unless-stopped

  # Admin frontend (Vite SPA on nginx). Serves the static build and reverse-proxies /v7 + /socket.io
  # to the api over the internal network (same origin → no CORS, no build-time API URL).
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    image: agora-admin
    environment:
      API_UPSTREAM: http://agora:4000
      # The scorer-worker serves the same /v1/:projectId/moderation/* surface the admin nginx proxies,
      # so only this upstream value changes (env name kept as MODERATOR_UPSTREAM for the foundation).
      MODERATOR_UPSTREAM: http://scorer-worker:4001
      # secure-chat upstream: the admin nginx routes /v7/:projectId/secure-chat/* + the /secure-socket/
      # realtime path here. Resolved lazily (variable proxy_pass + resolver), so when secure-chat isn't
      # deployed (no `secure` profile) those routes simply 502 instead of crashing nginx at boot.
      SECURE_CHAT_UPSTREAM: http://secure-chat:4002
      # Self-hosted object storage: the admin nginx serves public media at /media → MinIO (only used
      # when STORAGE_PROVIDER=s3; a Supabase deploy never hits this route). Lazy-resolved, so the admin
      # starts fine without the `selfhost` profile up. S3_BUCKET names the bucket the key lives under.
      MINIO_UPSTREAM: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-agora}
    ports:
      - "${ADMIN_PORT:-8080}:80"
    depends_on:
      - agora
      - scorer-worker
    init: true
    restart: unless-stopped

  # OPTIONAL TLS edge proxy (Caddy) — the single public front door. Terminates HTTPS with AUTOMATIC
  # Let's Encrypt certs (auto-renewed; internal CA for localhost), adds HSTS + security headers + a
  # request-body cap + an authoritative X-Forwarded-For, and reverse-proxies to the admin nginx. Gated
  # behind the `edge` profile so the default deploy is unchanged:  docker compose --profile edge up
  # When using it: point your domain's DNS at this host (so ACME can validate on :80), set SERVER_NAME +
  # RATE_LIMIT_TRUSTED_HOPS=2 in .env, and firewall the now-internal 4000/4001/8080 host ports.
  proxy:
    image: caddy:2-alpine
    profiles: ["edge"]
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      ADMIN_UPSTREAM: http://admin:80
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-25MB}
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # persists issued certs + ACME account — survives restarts (avoids LE rate limits)
      - caddy-config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - admin
    init: true
    restart: unless-stopped

  # Scheduler: fires the secret-gated /internal/cron/* endpoints over the internal network on the
  # schedule in apps/api/crontab. Requires CRON_SECRET in .env (without it the endpoints return 503).
  cron:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.cron
    image: agora-cron
    env_file: .env # CRON_SECRET
    environment:
      AGORA_URL: http://agora:4000
    depends_on:
      - agora
    init: true
    restart: unless-stopped

volumes:
  neo4j-data:
  caddy-data:
  caddy-config:
  scorer-hf-cache: # HF model downloads for the two scorer model servers (persist across recreate)
  db-data:         # self-hosted Postgres data (selfhost profile)
  minio-data:      # self-hosted object storage (selfhost profile)
