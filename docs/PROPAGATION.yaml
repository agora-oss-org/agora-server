# What mirrors what — the propagation map consumed by the /propagate skill and
# `pnpm --filter @agora/api check:propagation` (apps/api/scripts/check-propagation.ts).
# Design: docs/superpowers/specs/2026-07-03-propagate-doc-sync-design.md
#
# Obligations derived from this map are ADVISORY: not every subject belongs in every
# target (secrets get no compose default; dev-only vars skip prod). The /propagate
# checklist marks unresolved obligations "intentionally skipped?" for the user to rule
# on; recurring rulings get recorded under `exceptions:` so they stop resurfacing.

env-var:
  detect:
    - packages/core/src/lib/env.ts
  mechanical:
    - .env.dev.example
    - .env.selfhost.example
    - .env.prod.example
    - docker-compose.dev.yml
    - docker-compose.yml
    - docker-compose.prod.yml
  prose:
    - docs/SELF-HOSTING.md
    - README.md
    - CLAUDE.md
    - wiki/Deployment.md

endpoint:
  detect:
    - apps/api/src/routes/**
    - apps/secure-chat/src/routes/**
  prose:
    - docs/MANIFEST.md
    - docs/MODELS.md
    - wiki/API-Contract.md

compose:
  detect:
    - docker-compose.dev.yml
    - docker-compose.yml
    - docker-compose.prod.yml
    - deploy/**
  prose:
    - docs/SELF-HOSTING.md
    - README.md
    - wiki/Deployment.md

catch-all:
  detect:
    - apps/**
    - packages/**
    - services/**
  prose:
    - CHANGELOG.md

# Example entry (grows over time as the user rules on skipped obligations):
#   - subject: RATE_LIMIT_WINDOW_SECONDS
#     target: docker-compose.prod.yml
#     reason: tuned via .env only; compose never overrides it
exceptions:
  # MAX_POOLS is a generic, optional pool-tuning knob (default 50) that is irrelevant to a
  # single-DATABASE_URL deployment — which is every deployment of this (single-tenant) repo.
  # It ships in the .env templates + CLAUDE.md as a documented knob; compose passes it through
  # env_file automatically (no explicit default needed), and it has no place in user-facing
  # deploy docs. Multi-tenant registry tuning lives in ../agora-hosting.
  - subject: MAX_POOLS
    target: docker-compose.dev.yml
    reason: passed via env_file; optional tuning knob, no compose default needed
  - subject: MAX_POOLS
    target: docker-compose.yml
    reason: passed via env_file; optional tuning knob, no compose default needed
  - subject: MAX_POOLS
    target: docker-compose.prod.yml
    reason: passed via env_file; optional tuning knob, no compose default needed
  - subject: MAX_POOLS
    target: docs/SELF-HOSTING.md
    reason: internal registry tuning, irrelevant to single-tenant self-hosting
  - subject: MAX_POOLS
    target: README.md
    reason: internal registry tuning, irrelevant to single-tenant self-hosting
  - subject: MAX_POOLS
    target: wiki/Deployment.md
    reason: internal registry tuning, irrelevant to single-tenant self-hosting
  # AGORA_BOOT_MODULE is a hosting-layer boot hook (default unset), irrelevant to a single-tenant
  # deployment — which is every deployment of this repo. It ships in the .env templates + CLAUDE.md +
  # SELF-HOSTING.md as a documented seam; compose passes it through env_file (no explicit default), and
  # it has no place in user-facing deploy prose. Hosting init lives in ../agora-hosting.
  - subject: AGORA_BOOT_MODULE
    target: docker-compose.dev.yml
    reason: passed via env_file; hosting-layer knob, no compose default needed
  - subject: AGORA_BOOT_MODULE
    target: docker-compose.yml
    reason: passed via env_file; hosting-layer knob, no compose default needed
  - subject: AGORA_BOOT_MODULE
    target: docker-compose.prod.yml
    reason: passed via env_file; hosting-layer knob, no compose default needed
  - subject: AGORA_BOOT_MODULE
    target: README.md
    reason: hosting-layer seam; documented in SELF-HOSTING.md + CLAUDE.md, not a user-facing self-host knob
  - subject: AGORA_BOOT_MODULE
    target: wiki/Deployment.md
    reason: hosting-layer seam; documented in SELF-HOSTING.md + CLAUDE.md, not a user-facing self-host knob
  # SETTINGS_READONLY_EMAILS is an operator-tier allowlist var, same class as OPERATOR_EMAILS (which
  # also has no explicit compose entry or root-README mention). docker-compose.dev.yml never runs an
  # `agora` container (dev runs the API on the host via `pnpm dev`, loading .env directly) — there is no
  # compose service to declare it on. docker-compose.yml's `agora` service uses `env_file: .env`, so it
  # (like OPERATOR_EMAILS) passes through automatically without an explicit `environment:` entry.
  # docker-compose.prod.yml enumerates every var explicitly (no env_file) and DOES declare it there.
  - subject: SETTINGS_READONLY_EMAILS
    target: docker-compose.dev.yml
    reason: no `agora` service in dev compose (API runs on the host); nothing to declare it on
  - subject: SETTINGS_READONLY_EMAILS
    target: docker-compose.yml
    reason: passed via env_file, same as OPERATOR_EMAILS; no explicit compose entry needed
  - subject: SETTINGS_READONLY_EMAILS
    target: README.md
    reason: operator-tier config knob documented in CLAUDE.md + docs/CHEAT-SHEET.md, same as
      OPERATOR_EMAILS (also absent from the top-level README's quickstart/env-file overview)
